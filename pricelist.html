<style>html,body{margin:0;min-height:100%;background:#080808;color:#fff;font-family:Arial,Helvetica,sans-serif}.nav{position:sticky;top:0;z-index:9999;background:rgba(8,8,8,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1);padding:16px 24px;text-align:center}.nav a{display:inline-block;color:#fff;text-decoration:none;padding:9px 16px;margin:0 4px;border-radius:9px}.nav a:hover{background:#1a1a1a}.wrap{max-width:1200px;margin:auto;padding:70px 24px}.loading{text-align:center;color:#aaa}.price-page h1{font-size:clamp(40px,7vw,72px);margin:0 0 12px}.price-page .intro{color:#aaa;margin-bottom:35px}.price-page .price-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.price-page .price-card{background:#151515;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:30px}.price-page .price-card.premium{background:#f4f4f4;color:#000}.price-page .price-card h3{font-size:24px}.price-page .price-amount{font-size:29px;font-weight:800}.price-page .price-features{color:#aaa}.price-page .premium .price-features{color:#555}.price-page a.btn-solid,.price-page a.btn-outline{display:flex;justify-content:center;align-items:center;min-height:45px;margin-top:25px;border-radius:9px;text-decoration:none}.price-page a.btn-solid{background:#000;color:#fff}.price-page a.btn-outline{border:1px solid #555;color:#fff}.price-page a:hover{opacity:.85}@media(max-width:850px){.price-page .price-grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.wrap{padding:50px 16px}.price-page .price-grid{grid-template-columns:1fr}}</style>

<script>
(async function(){try{const r=await fetch('https://raw.githubusercontent.com/anothervisual/site.id/main/README.md',{cache:'no-store'});if(!r.ok)throw Error();const doc=new DOMParser().parseFromString(await r.text(),'text/html');const price=doc.querySelector('#pricelist');const main=document.querySelector('.wrap');if(price){main.innerHTML='<div class="price-page">'+price.outerHTML+'</div>'}else{main.innerHTML='<div class="price-page"><h1>Pricelist</h1><p class="intro">Pricelist belum ditemukan di halaman sumber.</p></div>'}}catch(e){document.getElementById('loading').textContent='Pricelist gagal dimuat. Silakan refresh halaman.'}})();
</script>
